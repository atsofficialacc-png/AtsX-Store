<!DOCTYPE html>
<html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#170b28"><title>PUBG UC - AtsX Store</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#170b28;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif;padding:16px}.container{max-width:430px;margin:auto}.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{background:#24153b;border:1px solid #2e1c4a;color:#fff;border-radius:12px;padding:10px 13px;font-size:18px}.card{background:#201235;border:1px solid #2e1c4a;border-radius:16px;padding:16px;margin-bottom:16px}.ct{color:#d8b4fe;font-size:13px;font-weight:700;margin-bottom:12px}.inputs,.pkgs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input{width:100%;background:#150a24;border:1px solid #2e1c4a;border-radius:12px;padding:13px;color:#fff;outline:0}.input:focus{border-color:#a855f7}.pkg{background:#180d28;border:1px solid #2e1c4a;border-radius:12px;padding:13px;text-align:center}.pkg.active{border:2px solid #a855f7}.pkg b{display:block;font-size:12px}.price{color:#d8b4fe;font-size:11px;margin-top:4px}.buy{width:100%;border:0;border-radius:12px;padding:15px;background:linear-gradient(90deg,#b17ffb,#a26ef7);font-weight:800;color:#10071b}
</style></head><body><main class="container"><div class="head"><button class="back" onclick="history.back()">‹</button><h3>PUBG Mobile UC</h3></div>
<div class="card"><div class="ct">၁။ Account အချက်အလက် ဖြည့်ပါ</div><div class="inputs"><input id="uid" class="input" placeholder="User ID"><input id="zone" class="input" placeholder="Zone ID"></div></div>
<div class="card"><div class="ct">၂။ ဝယ်ယူလိုသော ပမာဏ ရွေးပါ</div><div class="pkgs">
<div class="pkg active" onclick="pick(this,'60 UC','3,000 Ks')"><b>60 UC</b><span class="price">3,000 Ks</span></div>
<div class="pkg" onclick="pick(this,'325 UC','6,000 Ks')"><b>325 UC</b><span class="price">6,000 Ks</span></div>
<div class="pkg" onclick="pick(this,'660 UC','12,000 Ks')"><b>660 UC</b><span class="price">12,000 Ks</span></div>
<div class="pkg" onclick="pick(this,'985 UC','18,000 Ks')"><b>985 UC</b><span class="price">18,000 Ks</span></div>
<div class="pkg" onclick="pick(this,'1,320 UC','24,000 Ks')"><b>1,320 UC</b><span class="price">24,000 Ks</span></div>
<div class="pkg" onclick="pick(this,'1,800 UC','32,000 Ks')"><b>1,800 UC</b><span class="price">32,000 Ks</span></div>
<div class="pkg" onclick="pick(this,'2,400 UC','42,000 Ks')"><b>2,400 UC</b><span class="price">42,000 Ks</span></div>
<div class="pkg" onclick="pick(this,'Weekly Pass','5,500 Ks')"><b>Weekly Pass</b><span class="price">5,500 Ks</span></div>
</div></div><button class="buy" onclick="buy()">ခုချက်ချင်း ဝယ်ယူမည်</button></main>
<script>
let selected='60 UC';function pick(el,name){document.querySelectorAll('.pkg').forEach(x=>x.classList.remove('active'));el.classList.add('active');selected=name}
function buy(){if(!document.getElementById('uid').value.trim()||!document.getElementById('zone').value.trim()){alert('User ID နဲ့ Zone ID ဖြည့်ပါ');return}alert('ရွေးထားသော Package: '+selected+'\nOrder ကို လက်ခံရရှိပါပြီ။')}
</script></body></html>
